name: ETF Market Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * 1-5'

permissions:
  contents: read

concurrency:
  group: etf-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas_market_calendars

      - name: Restore today's alert history
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: alert_state.json
          key: etf-alerts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            etf-alerts-

      - name: Test LINE push manually
        if: github.event_name == 'workflow_dispatch'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python test_line.py

      - name: Run scheduled V3.0 monitor
        if: github.event_name == 'schedule'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_FEED: iex
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python monitor_v3.py

      - name: Save today's alert history
        if: always() && github.event_name == 'schedule' && hashFiles('alert_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: alert_state.json
          key: etf-alerts-${{ github.run_id }}-${{ github.run_attempt }}
