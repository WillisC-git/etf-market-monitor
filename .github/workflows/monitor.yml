
name: ETF Market Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * 1-5'

permissions:
  contents: read

concurrency:
  group: etf-market-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Alpaca API manually
        if: github.event_name == 'workflow_dispatch'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_FEED: iex
        run: python monitor_v2.py

      - name: Run scheduled monitor
        if: github.event_name == 'schedule'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_FEED: iex
        run: python monitor.py
